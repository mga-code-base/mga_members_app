name: Build and Release Flutter APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    tags:
      - 'v*'        # Triggers when pushing a release tag (e.g., v1.0.0)

# Grants write access required to create releases and upload APK assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Manual Build' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
